services:
  panel:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./panel/server.py:/app/server.py:ro
    command: ["python", "/app/server.py"]
    networks: [tunnel]

  master:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["master", "--listen", ":8080", "--token", "docker-secret"]
    ports:
      - "18080:8080"
    networks: [tunnel]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 30

  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      master:
        condition: service_healthy
      panel:
        condition: service_started
    environment:
      HOME: /data
    volumes:
      - agent-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        1panel-agent agent set --panel-url http://panel:20560 --panel-key panel-secret
        exec 1panel-agent agent register master:8080/docker-secret
    networks: [tunnel]

networks:
  tunnel:

volumes:
  agent-data:
